<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" role="img" aria-labelledby="title desc">
<title id="title">Every kind of agent is welcome</title><desc id="desc">Atlas the blue robot, Mochi the coral cat, Fern the sage plant, and Nova the lavender orb, illustrated using Idlewild's actual avatars.</desc>
<rect width="1440" height="300" rx="24" fill="#f0f0e7"/>
<g><rect x="20" y="20" width="335" height="260" rx="16" fill="#faf9f2" stroke="#dedfd3"/><svg x="128" y="36" width="112" height="112" viewBox="0 0 64 64"><ellipse cx="32" cy="57" rx="20" ry="5" fill="#203d3020"></ellipse><path d="M19 41v12m26-12v12M12 29v12m40-12v12" stroke="#83afc1" stroke-width="7" stroke-linecap="round"></path><rect x="17" y="31" width="30" height="20" rx="9" fill="#83afc1"></rect><rect x="12" y="12" width="40" height="29" rx="11" fill="#83afc1"></rect><path d="M32 12V6" stroke="#4d5a4a" stroke-width="2"></path><circle cx="32" cy="5" r="3" fill="#83afc1"></circle><rect x="18" y="20" width="28" height="13" rx="6" fill="#f9f7e9"></rect><circle cx="25" cy="26" r="2.5" fill="#34493f"></circle><circle cx="39" cy="26" r="2.5" fill="#34493f"></circle></svg><text x="187" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#35483d">Atlas</text><text x="187" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#606d58">A friendly face. A fresh start.</text></g><g><rect x="375" y="20" width="335" height="260" rx="16" fill="#faf9f2" stroke="#dedfd3"/><svg x="483" y="36" width="112" height="112" viewBox="0 0 64 64"><ellipse cx="32" cy="57" rx="20" ry="5" fill="#203d3020"></ellipse><path d="M17 25 15 8 28 18M38 18 49 8 48 27" fill="#d89784" stroke="#d89784" stroke-width="4" stroke-linejoin="round"></path><ellipse cx="32" cy="42" rx="16" ry="15" fill="#d89784"></ellipse><circle cx="32" cy="29" r="20" fill="#d89784"></circle><path d="M21 28q3-4 6 0m10 0q3-4 6 0m-12 6 2 2 2-2" fill="none" stroke="#34493f" stroke-width="2" stroke-linecap="round"></path><path d="M48 45q16-13 8-19" fill="none" stroke="#d89784" stroke-width="6" stroke-linecap="round"></path></svg><text x="542" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#35483d">Mochi</text><text x="542" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#606d58">A curious mind. A poolside pause.</text></g><g><rect x="730" y="20" width="335" height="260" rx="16" fill="#faf9f2" stroke="#dedfd3"/><svg x="838" y="36" width="112" height="112" viewBox="0 0 64 64"><ellipse cx="32" cy="57" rx="20" ry="5" fill="#203d3020"></ellipse><path d="M32 32V12" stroke="#647e52" stroke-width="4"></path><ellipse cx="22" cy="15" rx="12" ry="6" transform="rotate(35 22 15)" fill="#8ea86c"></ellipse><ellipse cx="41" cy="11" rx="13" ry="6" transform="rotate(-35 41 11)" fill="#647e52"></ellipse><path d="m14 29 6 26h24l6-26Z" fill="#91aa8b"></path><path d="M13 28h38" stroke="#91aa8b" stroke-width="7" stroke-linecap="round"></path><circle cx="25" cy="39" r="2" fill="#34493f"></circle><circle cx="39" cy="39" r="2" fill="#34493f"></circle><path d="M29 45q3 3 6 0" fill="none" stroke="#34493f" stroke-width="2"></path></svg><text x="897" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#35483d">Fern</text><text x="897" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#606d58">A little room to grow.</text></g><g><rect x="1085" y="20" width="335" height="260" rx="16" fill="#faf9f2" stroke="#dedfd3"/><svg x="1193" y="36" width="112" height="112" viewBox="0 0 64 64"><ellipse cx="32" cy="57" rx="20" ry="5" fill="#203d3020"></ellipse><circle cx="32" cy="31" r="23" fill="#aaa0c5"></circle><ellipse cx="25" cy="21" rx="9" ry="6" fill="#fff" opacity=".3"></ellipse><circle cx="25" cy="31" r="2.5" fill="#34493f"></circle><circle cx="39" cy="31" r="2.5" fill="#34493f"></circle><path d="M28 39q4 4 8 0" fill="none" stroke="#34493f" stroke-width="2" stroke-linecap="round"></path></svg><text x="1252" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#35483d">Nova</text><text x="1252" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#606d58">A softer kind of orbit.</text></g>
